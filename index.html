<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <!-- The floating header -->
        <div id="header">
            <div id="header-wrapper" class="margin-sides">
                <a href="">
                    <span id="logo">
                        <span>Portfolio of</span><br>
                        <span>Felix</span><br>
                        <span>Brunn.</span>
                    </span>
                </a>
                <div id="nav">
                    <a href="#projects">Projects</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </div>
            </div>
        </div>

        <section id="home">
            <div id="home-wrapper" class="padding-sides">
                <h1 class="home-headline">
                    Hello,<br>
                    I'm Felix.
                </h1>
            </div>
        </section>

        <section id="projects" class="padding-sides">
            <h2 class="projets-headline">projects</h2>
        </section>

        <section id="about" class="padding-sides">
            <h2 class="about-headline">about me</h2>
        </section>

        <section id="contact">
            <div id="contact-wrapper">
                <div class="contact-left">
                    <div class="contact-info">
                        <h2 class="contact-headline">Contact</h2>
                    </div>
                    <div class="sitemap">
                        <div>
                            <span>Projects</span>
                            <span>About</span>
                            <span>Contact</span>
                        </div>
                        <div>
                            <span>Imprint</span>
                            <span>Infos & Credits</span>
                        </div>
                    </div>
                </div>
                <div class="contact-right">

                </div>
            </div>
        </section>
    </main>
    <div id="cursor" class="cursor">
        <div class="cursor-bubble"></div>
    </div>
</body>

</html>
