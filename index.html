<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- The floating header -->
    <header>
        <div id="header-wrapper">
            <a href="">
                <span id="logo">
                    <span>Portfolio</span><br>
                    <span>of</span><br>
                    <span>Felix Brunn.</span>
                </span>
            </a>
            <nav>
                <a href="#projects"><span>Projects</span></a><a href="#about"><span>About</span></a><a href="#contact"><span>Contact</span></a>
            </nav>
        </div>
    </header>
    <main>

        <section id="home">
            <div id="home-wrapper" class="padding-sides">
                <h1 class="home-headline">
                    Hello,<br>
                    I'm Felix<span class="colored-dot">.</span>
                </h1>
            </div>
        </section>

        <section id="about" class="padding-sides">
            <h2 class="about-headline">about<span class="colored-dot">.</span></h2>
        </section>

        <section id="projects" class="padding-sides">
            <h2 class="projets-headline">projects<span class="colored-dot">.</span></h2>
            <div id="project-wrapper">
                <div class="project-card">
                    <img src="" alt="">
                </div>
            </div>
        </section>

        <section id="contact">
            <div id="contact-wrapper">
                <div class="contact-left">
                    <div class="contact-info">
                        <h2 class="contact-headline">Contact<span class="colored-dot">.</span></h2>
                    </div>
                    <div class="sitemap">
                        <div>
                            <span>Projects</span>
                            <span>About</span>
                            <span>Contact</span>
                        </div>
                        <div>
                            <span>Imprint</span>
                            <span>Infos & Credits</span>
                        </div>
                    </div>
                </div>
                <div class="contact-right">

                </div>
            </div>
        </section>
    </main>
    <div id="cursor" class="cursor">
        <div class="cursor-bubble">
            <div class="cursor-text">POONG</div>
        </div>
    </div>
</body>

</html>
